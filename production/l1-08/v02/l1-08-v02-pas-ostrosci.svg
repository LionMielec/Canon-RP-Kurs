<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Zasięg ostrości przy F1.8 i przy F8</title>
  <desc id="d">Widok z góry. Po lewej aparat, przed nim w szeregu trzy przedmioty: przedni kubek, środkowy kubek z punktem ostrości i książka. Górny panel F1.8: jasny zasięg ostrości jest wąski i obejmuje tylko środkowy kubek. Dolny panel F8: zasięg ostrości jest szeroki i obejmuje wszystkie trzy przedmioty; za punktem ostrości sięga nieco dalej niż przed nim.</desc>
  <!-- Kolory ze zmiennych app/dist/style.css: bg #f8f3fc, paper #fffdfd, line #e6dcec,
       lavender #ece2f7, violet #70429b, violet-dark #51316f, focus #a33284, ink #382343.
       Odcień przedmiotów poza pasem (#c4b3d6) jak w schemacie L1-06-V02.
       Skala: 1 m = 440 px od przodu aparatu (x = 150). Przedmioty: 0,8 / 1,0 / 1,2 m. -->
  <rect width="800" height="640" fill="#f8f3fc"/>

  <!-- Panel F1.8 -->
  <rect x="30" y="20" width="740" height="290" rx="16" fill="#fffdfd" stroke="#e6dcec" stroke-width="2"/>
  <text x="60" y="66" font-size="30" font-weight="700" fill="#382343">F1.8</text>
  <rect x="568" y="125" width="48" height="120" rx="10" fill="#ece2f7" stroke="#70429b" stroke-width="3"/>
  <line x1="150" y1="185" x2="569" y2="185" stroke="#70429b" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <rect x="62" y="157" width="70" height="56" rx="8" fill="#51316f"/>
  <rect x="132" y="169" width="18" height="32" rx="3" fill="#51316f"/>
  <text x="97" y="254" text-anchor="middle" font-size="26" font-weight="600" fill="#382343">aparat</text>
  <circle cx="502" cy="185" r="22" fill="#c4b3d6"/>
  <circle cx="590" cy="185" r="22" fill="#a33284"/>
  <rect x="672" y="148" width="13" height="74" rx="3" fill="#c4b3d6"/>

  <!-- Panel F8 -->
  <rect x="30" y="330" width="740" height="290" rx="16" fill="#fffdfd" stroke="#e6dcec" stroke-width="2"/>
  <text x="60" y="376" font-size="30" font-weight="700" fill="#382343">F8</text>
  <rect x="468" y="435" width="258" height="120" rx="14" fill="#ece2f7" stroke="#70429b" stroke-width="3"/>
  <line x1="150" y1="495" x2="569" y2="495" stroke="#70429b" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <rect x="62" y="467" width="70" height="56" rx="8" fill="#51316f"/>
  <rect x="132" y="479" width="18" height="32" rx="3" fill="#51316f"/>
  <text x="97" y="564" text-anchor="middle" font-size="26" font-weight="600" fill="#382343">aparat</text>
  <circle cx="502" cy="495" r="22" fill="#70429b"/>
  <circle cx="590" cy="495" r="22" fill="#a33284"/>
  <rect x="672" y="458" width="13" height="74" rx="3" fill="#70429b"/>
</svg>
