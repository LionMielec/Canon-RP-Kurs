# Kurs Canon RP — serwer stron na hermes-vps-1 (D-088).
# Instaluje go setup-nginx.sh jako /etc/nginx/sites-available/canon-rp-kurs.
# Ruch z sieci Tailscale przekazuje tu tailscale serve (port 443).

server {
    # Tylko lokalnie. Z internetu i z sieci Tailscale nie da się tu wejść bezpośrednio.
    listen 127.0.0.1:8081;

    root /srv/canon-rp-kurs;
    index index.html;
    charset utf-8;

    # Bez numeru wersji nginx w nagłówkach i na stronach błędów.
    server_tokens off;

    # Telefon zawsze pyta, czy jest nowsza wersja pliku (D-087).
    etag on;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        # add_header w tym bloku zastępuje nagłówki z bloku server, więc powtarzamy.
        add_header Cache-Control "no-cache" always;
    }
}
