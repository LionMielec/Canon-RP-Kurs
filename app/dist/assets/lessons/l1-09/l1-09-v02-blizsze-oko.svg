  <text x="440" y="602" text-anchor="end" font-size="24" font-weight="600" fill="#382343">dalsze oko</text>
  <line x1="448" y1="594" x2="534" y2="571" stroke="#382343" stroke-width="2" stroke-linecap="round"/>
  <text x="668" y="392" font-size="24" font-weight="600" fill="#382343">ucho</text>
  <line x1="664" y1="386" x2="632" y2="408" stroke="#382343" stroke-width="2" stroke-linecap="round"/>
</svg>
