<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Bliższe oko i zasięg ostrości przy F1.8 i przy F2.8</title>
  <desc id="d">Widok z góry. Po lewej aparat, po prawej głowa osoby lekko obrócona; jedno oko jest bliżej aparatu, drugie dalej. Jasne pole pokazuje zasięg ostrości i przechodzi przez bliższe oko. Elementy w polu mają pełny kolor, elementy poza polem są jaśniejsze. Górny panel F1.8: pole wąskie; nos wystaje przed pole i jest jaśniejszy, dalsze oko jest na tylnej granicy pola, uszy poza polem. Dolny panel F2.8: pole szersze; nos i oba oczy są w polu, uszy poza nim.</desc>
  <!-- Kolory i układ jak L1-08-V02 (production/l1-08/v02/l1-08-v02-pas-ostrosci.svg):
       bg #f8f3fc, paper #fffdfd, line #e6dcec, lavender #ece2f7, violet #70429b,
       violet-dark #51316f, focus #a33284, ink #382343.
       Oznaczenie jak w L1-08-V02: #a33284 punkt ostrości (bliższe oko), #70429b pełny kolor
       w polu, #c4b3d6 jaśniej poza polem — jednakowo dla nosa i uszu w obu panelach.
       Obrys głowy oraz boki nosa i uszu: #51316f, żeby jasne elementy nie zlewały się z obrysem.
       Odległość aparat–głowa (ok. 1 m) skrócona; głowa i pola w jednej skali: 1 cm = 11 px.
       Rachunek (karta L1-09, V02): 50 mm, 1 m, krążek rozmycia 0,03 mm.
       F1.8: 2,1 cm przed i 2,2 cm za bliższym okiem; F2.8: 3,3 cm przed i 3,5 cm za.
       Głowa obrócona o 20°, rozstaw oczu 6,3 cm: czubek nosa 2,5 cm przed bliższym okiem,
       dalsze oko 2,2 cm za, ucho po stronie bliższego oka 9 cm za.
       Obrys głowy: elipsa 19,7 × 15,6 cm, przód przechodzi przez oczy; nos to klin
       z podstawą 2,8 cm na obrysie między oczami, wystający około 3 cm. -->
  <rect width="800" height="640" fill="#f8f3fc"/>

