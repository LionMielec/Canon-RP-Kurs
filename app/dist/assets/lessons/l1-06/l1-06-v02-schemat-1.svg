<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Miejsce 1: światło z przodu</title>
  <desc id="d">Widok z góry. Na górze ściana z oknem, blisko okna przedmiot. Trzy miejsca Ani z aparatem skierowanym na przedmiot: 1 między oknem a przedmiotem, plecami do okna; 2 z boku, okno z jej boku; 3 za przedmiotem, twarzą do okna. Podświetlone miejsce 1: światło z przodu.</desc>
  <rect width="800" height="640" fill="#f8f3fc"/>
  <rect x="30" y="74" width="740" height="536" rx="16" fill="#fffdfd" stroke="#e6dcec" stroke-width="2"/>
  <path d="M300 96 L500 96 L610 600 L190 600 Z" fill="#ece2f7" opacity="0.6"/>
  <rect x="30" y="74" width="740" height="22" rx="4" fill="#e6dcec"/>
  <rect x="300" y="68" width="200" height="34" rx="4" fill="#fffdfd" stroke="#70429b" stroke-width="4"/>
  <text x="400" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#382343">okno</text>
  <g transform="translate(150 330) rotate(-90)"><rect x="-22" y="26" width="44" height="18" rx="4" fill="#c4b3d6"/><rect x="-10" y="42" width="20" height="14" rx="3" fill="#c4b3d6"/></g>
  <circle cx="150" cy="330" r="32" fill="#ddd0ea"/>
  <text x="150" y="342" text-anchor="middle" font-size="34" font-weight="700" fill="#a898b8">2</text>
  <text x="160" y="412" text-anchor="middle" font-size="30" font-weight="600" fill="#a898b8">światło z boku</text>
  <g transform="translate(400 510) rotate(180)"><rect x="-22" y="26" width="44" height="18" rx="4" fill="#c4b3d6"/><rect x="-10" y="42" width="20" height="14" rx="3" fill="#c4b3d6"/></g>
  <circle cx="400" cy="510" r="32" fill="#ddd0ea"/>
  <text x="400" y="522" text-anchor="middle" font-size="34" font-weight="700" fill="#a898b8">3</text>
  <text x="452" y="521" text-anchor="start" font-size="30" font-weight="600" fill="#a898b8">światło od tyłu</text>
  <line x1="400" y1="180" x2="400" y2="330" stroke="#70429b" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle cx="400" cy="330" r="34" fill="#a33284"/>
  <g transform="translate(400 180) rotate(0)"><rect x="-22" y="26" width="44" height="18" rx="4" fill="#51316f"/><rect x="-10" y="42" width="20" height="14" rx="3" fill="#51316f"/></g>
  <circle cx="400" cy="180" r="32" fill="#70429b"/>
  <text x="400" y="192" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">1</text>
  <text x="452" y="191" text-anchor="start" font-size="30" font-weight="700" fill="#382343">światło z przodu</text>
</svg>
